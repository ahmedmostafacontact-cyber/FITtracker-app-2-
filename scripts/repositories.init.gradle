gradle.beforeProject { p ->
  [p.repositories, p.buildscript.repositories].each { repos ->
    repos.withType(org.gradle.api.artifacts.repositories.MavenArtifactRepository).configureEach { repo ->
      def host = repo.url.host
      if (host == 'dl.google.com' || host == 'maven.google.com') {
        repo.content {
          includeGroupByRegex('androidx\\..*')
          includeGroupByRegex('com\\.android.*')
          includeGroupByRegex('com\\.google.*')
          includeGroupByRegex('com\\.google\\.firebase.*')
          includeGroupByRegex('android\\.arch.*')
        }
      }
    }
  }
}
